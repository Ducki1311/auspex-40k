name: Wahapedia-Abgleich

# Prüft wöchentlich Punkte, Staffelpreise, Profile, Ausrüstungs- und Enhancement-Punkte
# gegen den öffentlichen Wahapedia-Datenexport (11. Edition). Es werden KEINE Wahapedia-Daten
# ins Repository übernommen: der Bericht landet als Issue und als Workflow-Artefakt.
on:
  schedule:
    - cron: '17 4 * * 1'      # montags 04:17 UTC
  workflow_dispatch:
    inputs:
      keep_csv:
        description: 'CSV-Rohdaten als Artefakt behalten (für die manuelle Prüfung)'
        type: boolean
        default: false
      no_issue:
        description: 'Kein Issue anlegen (nur Bericht)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wahapedia-Export laden
        run: |
          mkdir -p "$RUNNER_TEMP/waha"
          for f in Factions Source Last_update Datasheets Datasheets_models Datasheets_models_cost \
                   Datasheets_leader Datasheets_wargear Datasheets_keywords Datasheets_unit_composition \
                   Datasheets_options Datasheets_abilities Abilities Enhancements Detachments; do
            curl -fsSL --retry 6 --retry-delay 20 --retry-all-errors --max-time 300 -A "Auspex40k-DataCheck (+https://github.com/${{ github.repository }})" \
              "https://wahapedia.ru/wh40k11ed/${f}.csv" -o "$RUNNER_TEMP/waha/${f}.csv"
            echo "$f: $(wc -l < "$RUNNER_TEMP/waha/${f}.csv") Zeilen"
            sleep 4
          done

      - name: Abgleich
        run: node .github/scripts/wahapedia-check.mjs --waha "$RUNNER_TEMP/waha" --data game-data-11e.js --out wahapedia-report.json --md wahapedia-report.md

      - name: Bericht als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: wahapedia-report
          path: |
            wahapedia-report.json
            wahapedia-report*.md
          retention-days: 30

      - name: CSV als Artefakt (nur auf Wunsch)
        if: ${{ inputs.keep_csv }}
        uses: actions/upload-artifact@v4
        with:
          name: wahapedia-csv
          path: ${{ runner.temp }}/waha/*.csv
          retention-days: 3

      - name: Issue anlegen oder aktualisieren
        if: ${{ !inputs.no_issue }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOTAL=$(node -e "const r=require('./wahapedia-report.json');const s=r.summary;console.log(['punkte','staffelpreise','schluesselwoerter','charakterTyp','profile','waffen','ausruestungPreis','ausruestungFehlt','anfuehrer','enhancementPunkte','detachmentPunkte'].reduce((a,k)=>a+(s[k]||0),0))")
          echo "Relevante Abweichungen: $TOTAL"
          gh label create data-sync --color FFB000 --description "Automatischer Datenabgleich" 2>/dev/null || true
          NUM=$(gh issue list --label data-sync --state open --json number --jq '.[0].number')
          if [ "$TOTAL" -eq 0 ]; then
            [ -n "$NUM" ] && gh issue close "$NUM" --comment "Keine Abweichungen mehr ($(date -u +%F))."
            exit 0
          fi
          if [ -n "$NUM" ]; then gh issue edit "$NUM" --title "Datenabgleich: $TOTAL Abweichungen zu Wahapedia" --body-file wahapedia-report.md
          else NUM=$(gh issue create --title "Datenabgleich: $TOTAL Abweichungen zu Wahapedia" --label data-sync --body-file wahapedia-report.md | grep -o '[0-9]*$'); fi
          # alte Berichtsteile des Bots entfernen, damit das Issue immer genau einen aktuellen Bericht zeigt
          gh api "repos/${{ github.repository }}/issues/$NUM/comments" --paginate --jq '.[] | select(.user.login=="github-actions[bot]") | .id' | while read -r C; do gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$C" >/dev/null; done
          for p in $(ls wahapedia-report.part*.md 2>/dev/null | sort -V); do gh issue comment "$NUM" --body-file "$p"; done
