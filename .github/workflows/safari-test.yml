name: Safari-Test (WebKit, iPhone)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Fertiges Playwright-Image mit WebKit – keine langsame Paketinstallation
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Playwright (passend zum Image)
        run: pip install --break-system-packages playwright==1.55.0 || pip install playwright==1.55.0
      - name: Rauchtest
        env:
          HOME: /root
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          python3 tests/browser/safari_smoke.py http://localhost:8765/index.html
