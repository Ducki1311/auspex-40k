name: Tests

# Läuft bei jedem Push und Pull Request: Datenprüfung + alle Testreihen der App (Generator, Regeln, Staffelpreise,
# Transporte, Enhancements …). Rot = nicht deployen, bevor der Fehler behoben ist.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Datenprüfung
        run: node .github/scripts/validate.mjs
      - name: Testreihen
        run: node tests/run.mjs
